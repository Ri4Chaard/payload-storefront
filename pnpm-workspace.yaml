allowBuilds:
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  esbuild: set this to true or false
minimumReleaseAgeExclude:
  - icu-minify@4.14.4
  - next-intl-swc-plugin-extractor@4.14.4
  - next-intl@4.14.4
  - use-intl@4.14.4
# pnpm 11 reads settings from here rather than package.json.
# esbuild ships prebuilt platform binaries via optional deps, so its postinstall is unnecessary —
# but pnpm's pre-run check aborts every `pnpm run` unless the build is approved or the check is off.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - '@tailwindcss/oxide'
  - unrs-resolver
verifyDepsBeforeRun: false
