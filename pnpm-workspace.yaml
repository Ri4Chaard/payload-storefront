# pnpm 11 refuses to install (ERR_PNPM_IGNORED_BUILDS) while any dependency with an install
# script is neither allowed nor denied. Every entry is decided explicitly:
#   true  — the package needs its script (sharp, @tailwindcss/oxide and unrs-resolver fetch or
#           link native binaries).
#   false — the package ships prebuilt platform binaries through optional dependencies, so its
#           script only re-checks what is already installed.
allowBuilds:
  sharp: true
  '@tailwindcss/oxide': true
  unrs-resolver: true
  esbuild: false
  '@swc/core': false
  '@parcel/watcher': false
minimumReleaseAgeExclude:
  - icu-minify@4.14.4
  - next-intl-swc-plugin-extractor@4.14.4
  - next-intl@4.14.4
  - use-intl@4.14.4
verifyDepsBeforeRun: false
