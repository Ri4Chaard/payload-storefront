name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every gate here blocks merge. A gate that has never failed is unproven — see T086 in
# specs/001-design-system-foundation/tasks.md, which deliberately breaks each one.
jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aurum
          POSTGRES_PASSWORD: aurum
          POSTGRES_DB: aurum
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aurum -d aurum"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URI: postgres://aurum:aurum@localhost:5432/aurum
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generated artifacts must match their sources. Constitution I and research.md R6.
      - name: Payload types are current
        run: |
          pnpm generate:types
          git diff --exit-code src/payload-types.ts \
            || { echo "::error::src/payload-types.ts is stale. Run 'pnpm generate:types' and commit."; exit 1; }

      # Gitignored, and `next build` does NOT create it — it fails on the missing module. Every
      # clean checkout has to generate its own.
      - name: Admin import map
        run: pnpm generate:importmap
        env:
          DATABASE_URI: postgres://ci:ci@127.0.0.1:5432/ci
          PAYLOAD_SECRET: ci-only-not-a-real-secret

      # Everything below this point reads the catalogue. The storefront has read Payload since
      # 003 Phase 9, so `pnpm build` prerenders product pages, and the end-to-end suite navigates to
      # specific slugs — an empty database fails the build with `relation "products" does not
      # exist`, and a migrated-but-empty one fails two dozen tests instead.
      #
      # The service container above starts Postgres; it does not start a schema, and it certainly
      # does not start a shop.
      - name: Database schema
        run: pnpm payload migrate

      - name: Development catalogue
        run: pnpm seed

      - name: Design tokens are current
        run: pnpm check:tokens

      - name: No magic values (TS/TSX)
        run: pnpm lint

      - name: No magic values (CSS)
        run: pnpm check:styles

      - name: Colour contrast meets WCAG 2.2 AA
        run: pnpm check:contrast

      - name: Every UI kit component has stories
        run: pnpm check:stories

      - name: Every path is kebab-case
        run: pnpm check:naming

      - name: Types
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The data layer against a real Postgres, including the US1 acceptance walk. It creates and
      # deletes its own documents under a marker slug, so it leaves the seeded catalogue as it
      # found it for the suites below.
      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Accessibility
        run: pnpm test:a11y

      # A build that compiles is not a story that renders — see tests/stories/foundations.spec.ts.
      - name: Stories render
        run: pnpm test:stories
