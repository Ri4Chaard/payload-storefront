# Nothing starts without a profile, because the two environments this file describes want
# different things:
#
#   docker compose --profile local up -d           Postgres alone, for an app running on the host
#                                                  (`pnpm dev`) against localhost:5432.
#
#   docker compose --profile dev up -d --build     The app alone. This is the VPS deployment: an
#                                                  image built from this checkout, migrations
#                                                  applied, `next start`. The database is provided
#                                                  separately and reached through DATABASE_URI.
#
# `dev` names a deployed environment, not a development one — it is the first stop for a commit
# that has left a laptop, and it runs the production build.
#
# Variables come from .env, which docker compose reads from this directory. `local` needs nothing
# in it; `dev` requires DATABASE_URI, PAYLOAD_SECRET and NEXT_PUBLIC_SERVER_URL, and refuses to
# start without them.

services:
  db:
    image: postgres:17-alpine
    container_name: aurum-db
    # Local development only. A deployment brings its own database.
    profiles: [local]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurum}
      POSTGRES_DB: ${POSTGRES_DB:-aurum}
    ports:
      # Loopback only — Postgres has no business on a machine's public interface.
      - '127.0.0.1:5432:5432'
    volumes:
      - aurum-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-aurum} -d ${POSTGRES_DB:-aurum}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      # next build inlines NEXT_PUBLIC_* into the client bundle, so the public origin is decided
      # here, at build time. Change it and the image must be rebuilt, not just restarted.
      args:
        NEXT_PUBLIC_SERVER_URL: '${NEXT_PUBLIC_SERVER_URL:?set NEXT_PUBLIC_SERVER_URL in .env — the public origin of this deployment}'
    image: aurum-app
    container_name: aurum-app
    profiles: [dev]
    restart: unless-stopped
    environment:
      # The database lives outside this file. Point DATABASE_URI at it in the deployment's .env —
      # a managed instance, or another compose project on the same host, in which case
      # host.docker.internal below resolves to the host's gateway address.
      DATABASE_URI: '${DATABASE_URI:?set DATABASE_URI in .env — the deployment database}'
      PAYLOAD_SECRET: '${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env — generate one with openssl rand -base64 32}'
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      # Publish behind a reverse proxy that terminates TLS; bind APP_PORT to 127.0.0.1 once one
      # is in front of it.
      - '${APP_PORT:-3000}:3000'
    volumes:
      # Uploads are written to the container's filesystem by Payload's local storage adapter, so
      # they need a volume to survive a redeploy.
      - aurum-media:/app/media
    # Migrations are generated and committed, never auto-pushed (Constitution IV), so a deploy has
    # to apply them. Doing it here rather than in the image's CMD keeps `docker run` honest: the
    # container that boots is the container that migrated, and a failed migration stops the deploy.
    command: sh -c 'pnpm payload migrate && pnpm start'

volumes:
  aurum-db-data:
  aurum-media:
