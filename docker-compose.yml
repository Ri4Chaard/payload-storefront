# Two profiles; nothing starts without one.
#
#   docker compose --profile local up -d          Postgres only, on 127.0.0.1:5432, for the app
#                                                 running on the host (`pnpm dev`).
#
#   docker compose --profile prod up -d --build   The app only, built from this checkout. The
#                                                 database is provisioned separately and reached
#                                                 through DATABASE_URI. Migrations run on start.
#
# For the app *and* its own Postgres in one command, use docker-compose.full.yml.
#
# Variables are read from .env next to this file. `environment:` is an allowlist: a variable not
# named here never reaches the container. Everything REQUIRED by src/env.ts must be listed.
# Missing required values are not guarded here (that would break the `local` profile too);
# src/env.ts refuses to start and names the missing variable.

name: aurum

services:
  db:
    profiles: [local]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurum}
      POSTGRES_DB: ${POSTGRES_DB:-aurum}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: [prod]
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-}
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    # Lets DATABASE_URI point at a Postgres running on the host as host.docker.internal.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DATABASE_URI: ${DATABASE_URI:-}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      EMAIL_OVERRIDE_RECIPIENT: ${EMAIL_OVERRIDE_RECIPIENT:-}
      RESEND_AUDIENCE_ID: ${RESEND_AUDIENCE_ID:-}
    volumes:
      - media:/app/media

volumes:
  db-data:
  media:
