services:
  db:
    image: postgres:17-alpine
    container_name: aurum-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: aurum
      POSTGRES_DB: aurum
    ports:
      - '5432:5432'
    volumes:
      - aurum-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurum -d aurum']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aurum-db-data:
